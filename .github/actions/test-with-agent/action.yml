name: Test With Agent
description: Run testWithAgent and fail if generated native-image metadata changes.

inputs:
  metadata-path:
    description: Path containing committed native-image metadata.
    default: src/main/resources/META-INF/native-image/net.minestom/minestom
    required: false
  arguments:
    description: Extra Gradle arguments.
    default: ""
    required: false

runs:
  using: composite
  steps:
    - name: Run testWithAgent
      shell: bash
      run: |
        metadata_path="${{ inputs.metadata-path }}"

        while IFS= read -r -d '' file; do
          rm -f "$file"
        done < <(git ls-files -z -- "$metadata_path")

        ./gradlew testWithAgent ${{ inputs.arguments }}

        git status --porcelain -- "$metadata_path" > "$RUNNER_TEMP/native-image-metadata-status.txt"
        if [ -s "$RUNNER_TEMP/native-image-metadata-status.txt" ]; then
          echo "::error::Native-image metadata is out of date. Run ./gradlew testWithAgent and commit the generated changes."
          echo "Changed files:"
          cat "$RUNNER_TEMP/native-image-metadata-status.txt"

          echo
          echo "Diff for tracked metadata files:"
          git diff -- "$metadata_path"

          mapfile -t untracked_files < <(git ls-files --others --exclude-standard -- "$metadata_path")
          if [ "${#untracked_files[@]}" -gt 0 ]; then
            echo
            echo "New generated metadata files:"
            printf '  %s\n' "${untracked_files[@]}"

            for file in "${untracked_files[@]}"; do
              echo
              echo "Diff for new file: $file"
              git diff --no-index -- /dev/null "$file" || true
            done
          fi

          exit 1
        fi
