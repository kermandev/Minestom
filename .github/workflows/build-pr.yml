name: Build PR

on:
  pull_request:
    branches: [ master ]
    types: [ opened, reopened, synchronize, labeled, closed ]
  merge_group:
    types: [ checks_requested ]

permissions:
  contents: read

concurrency:
  group: build-pr-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: JVM Test
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.repository_owner != github.event.pull_request.head.repo.owner.login }}
      - name: Run JVM Tests
        run: ./gradlew test

  javadoc:
    name: Javadoc Compilation
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.repository_owner != github.event.pull_request.head.repo.owner.login }}
      - name: Build Javadoc
        run: ./gradlew javadoc

  native-test:
    name: Native Test
    needs: build
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.repository_owner != github.event.pull_request.head.repo.owner.login }}
      - id: native-run
        name: Run Tests in Native Image
        continue-on-error: true
        run: ./gradlew nativeTest
      - name: Native Test (Fallback with Agent)
        if: steps.native-run.outcome == 'failure'
        run: ./gradlew -Pagent=standard test metadataCopy nativeTest --no-configuration-cache --no-build-cache

  binary-compatibility:
    name: Binary Compatibility
    if: |
      github.event.action != 'closed' &&
      !contains(github.event.pull_request.labels.*.name, 'breaking')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.repository_owner != github.event.pull_request.head.repo.owner.login }}
      - name: Check Binary Compatibility
        run: ./gradlew checkBinaryCompatibility

  publish:
    name: Publish PR
    needs: [build, javadoc, native-test, binary-compatibility]
    if: |
      github.repository == 'Minestom/Minestom' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'Publish Pull Request')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Publish Artifacts
        env:
          MINESTOM_VERSION: ${{ github.head_ref }}-SNAPSHOT
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSWORD }}
        run: |
          ./gradlew nmcpPublishAggregationToCentralPortalSnapshots
          echo "Version: ${MINESTOM_VERSION}" >> $GITHUB_STEP_SUMMARY
